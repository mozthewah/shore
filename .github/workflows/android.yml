name: Android TV APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Optional: a stable signing key lets you update in place without losing settings.
      # Add repository secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cleanframe.jks"
          echo "CLEANFRAME_KEYSTORE=$RUNNER_TEMP/cleanframe.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          CLEANFRAME_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CLEANFRAME_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CLEANFRAME_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Optional online wallpaper keys (repository secrets). Empty keys simply disable those sources.
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: gradle -p android assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: CleanFrame-TCL
          path: android/app/build/outputs/apk/release/*.apk
