name: Android TV APK

# Every push to main builds one keyless APK and publishes it as a GitHub release (v0.8.<commit count>).
# A push with several commits makes one release whose notes cover all of them; a newer push cancels an older
# build that is still running, so only the newest code is released.
# The public APK never contains API keys: online sources that need one stay off, and people who want
# them build Shore themselves (see the README).
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the commit count is the version
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check the app
        run: npm run check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Releases must always carry the same certificate, or installed copies can't update.
      # Repository secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Add the signing key secrets before releases can be published."; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shore.jks"
          echo "CLEANFRAME_KEYSTORE=$RUNNER_TEMP/shore.jks" >> "$GITHUB_ENV"

      - name: Build without keys
        env:
          SHORE_PUBLIC_BUILD: '1'
          CLEANFRAME_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CLEANFRAME_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CLEANFRAME_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle -p android assembleRelease
          count=$(git rev-list --count HEAD)
          echo "VERSION=0.8.$count" >> "$GITHUB_ENV"
          cp android/app/build/outputs/apk/release/app-release.apk "shore-0.8.$count.apk"
          rm -f "$RUNNER_TEMP/shore.jks"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A newer push supersedes this one: let its build publish everything instead.
          git fetch -q origin "$GITHUB_REF"
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then echo "A newer push is on main; skipping this release."; exit 0; fi
          node scripts/release-notes.mjs "$VERSION" "shore-$VERSION.apk" > notes.md
          gh release create "v$VERSION" "shore-$VERSION.apk" --title "Shore $VERSION" --notes-file notes.md --target "$GITHUB_SHA" --latest
