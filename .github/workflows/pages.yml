name: Website

on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/images/tcl/**', 'app/assets/wallpapers/bridge*.jpg', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/images
          cp -r site/. _site/
          cp docs/images/tcl/*.jpg _site/images/
          cp app/assets/manrope.woff2 app/assets/manrope-cyrillic.woff2 app/assets/manrope-latin-ext.woff2 _site/
          cp app/assets/wallpapers/bridge.jpg app/assets/wallpapers/bridge-panel.jpg _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
